<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="app-container">
        <header class="app-header text-center">
            <div class="header-badges">
                <div class="streak-badge" id="streakBadge">
                    <i class="fas fa-fire"></i>
                    <span id="streakCount">0</span>
                    <span class="streak-label">day streak</span>
                </div>
                <div class="points-badge" id="pointsBadge">
                    <i class="fas fa-star"></i>
                    <span id="pointsCount">0</span>
                    <span class="points-label">PTS</span>
                </div>
            </div>
            <h1 class="app-title"><i class="fas fa-calendar-check me-2"></i>Daily Task Planner</h1>
            <div class="date-display" id="currentDate"></div>
            <div class="clock-display" id="liveClock"></div>
        </header>

        <main class="main-content">
            <div class="glass-card input-section spring-in">
                <div class="input-group-wrapper">
                    <div class="input-row">
                        <input type="text" id="taskInput" class="form-control task-input" placeholder="What needs to be done?" maxlength="200">
                        <button id="addTaskBtn" class="btn btn-add"><i class="fas fa-plus me-1"></i>Add Task</button>
                    </div>
                    <div class="meta-row">
                        <select id="prioritySelect" class="form-select meta-select">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                        <select id="categorySelect" class="form-select meta-select">
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="meta-row mt-2">
                        <label class="alarm-label"><i class="fas fa-bell me-1"></i>Set Alarm (optional):</label>
                        <input type="datetime-local" id="alarmInput" class="form-select meta-select">
                    </div>
                </div>
            </div>

            <div class="glass-card controls-section spring-in" style="animation-delay:0.1s">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="form-control search-input" placeholder="Search tasks...">
                </div>
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">All <span class="badge-count" id="countAll">0</span></button>
                    <button class="filter-btn" data-filter="pending">Pending <span class="badge-count" id="countPending">0</span></button>
                    <button class="filter-btn" data-filter="completed">Completed <span class="badge-count" id="countCompleted">0</span></button>
                </div>
            </div>

            <div class="glass-card progress-section spring-in" style="animation-delay:0.2s">
                <div class="progress-header">
                    <span>Progress</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
                </div>
            </div>

            <div class="glass-card pet-section spring-in" style="animation-delay:0.25s">
                <div class="pet-header">
                    <h3><i class="fas fa-egg me-2"></i>Pet Hatchery</h3>
                    <button id="hatchBtn" class="btn btn-hatch" disabled><i class="fas fa-hammer me-1"></i>Hatch Egg</button>
                </div>
                <p class="pet-requirement" id="hatchRequirement">Reach a 10-day streak to hatch an egg!</p>
                <div class="pet-display" id="petDisplay">
                    <div class="pet-egg" id="petEgg">
                        <i class="fas fa-egg"></i>
                    </div>
                    <div class="pet-info" id="petInfo"></div>
                </div>
                <div class="evolution-bar" id="evolutionBar">
                    <div class="evolution-fill" id="evolutionFill"></div>
                    <span class="evolution-text" id="evolutionText">Stage 1</span>
                </div>
            </div>

            <div class="glass-card task-list-section spring-in" style="animation-delay:0.3s">
                <ul id="taskList" class="task-list"></ul>
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-clipboard-list"></i>
                    <p>No tasks yet. Add your first task above!</p>
                </div>
            </div>
        </main>
    </div>

    <div class="pet-modal-overlay" id="petModalOverlay">
        <div class="pet-modal" id="petModal">
            <div class="pet-modal-glow" id="petModalGlow"></div>
            <h2 class="pet-modal-title" id="petModalTitle"></h2>
            <div class="pet-modal-emoji" id="petModalEmoji"></div>
            <p class="pet-modal-name" id="petModalName"></p>
            <p class="pet-modal-rarity" id="petModalRarity"></p>
            <button class="btn btn-collect" id="collectPetBtn">Collect</button>
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>
    <div id="toastContainer" class="toast-container"></div>
    <div id="pointsPopupContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
